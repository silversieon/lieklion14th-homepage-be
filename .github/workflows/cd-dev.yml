name: CD - Development

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACTION_TOKEN }}
          submodules: true

      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build & Push
        run: |
          echo "🟢 [DEV] Building Docker image"
          docker build -f ./docker/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DEV_DOCKER_REPO }}:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DEV_DOCKER_REPO }}:latest-${{ github.sha }} .

          echo "🟢 [DEV] Pushing Docker image"
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DEV_DOCKER_REPO }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DEV_DOCKER_REPO }}:latest-${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          source: "docker/docker-compose.yml,docker/docker-compose-dev.yml"
          target: "~/app"

      - name: Deploy on Development Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            cd ~/app/docker

            echo "🟢 [DEV] .env 생성 중..."
            printf "${{ secrets.DEV_ENV_FILE }}" > .env

            echo "🟢 [DEV] 최신 이미지 pull (app만)"
            docker compose -f docker-compose.yml -f docker-compose-dev.yml pull app

            echo "🟢 [DEV] 앱 컨테이너만 재기동"
            docker compose -f docker-compose.yml -f docker-compose-dev.yml up -d --no-deps app

            echo "🟢 [DEV] 사용하지 않는 이미지 정리"
            docker image prune -f

            echo "✅ [DEV] 배포 완료!"